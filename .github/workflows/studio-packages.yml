name: Build PyAbel Studio packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: PyAbel_GUIs/packaging/windows/requirements-build.txt

      - name: Build and validate PyAbel Studio
        shell: powershell
        run: PyAbel_GUIs\packaging\windows\build_windows_app.ps1 -Python python

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PyAbel-Studio-Windows-x64
          path: dist/PyAbel-Studio-Windows-x64.zip
          if-no-files-found: error
